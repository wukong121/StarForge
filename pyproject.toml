[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "starforge-rl"
version = "0.1.0"
description = "Brood War RL integration foundation with explicit benchmark provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
starforge = "starforge.__main__:main"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.18,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["starforge"]

[tool.uv]
required-version = "==0.13.5"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["starforge/runtime"]
strict = true
follow_imports = "silent"
