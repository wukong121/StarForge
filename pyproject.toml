[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starforge-rl"
version = "0.1.0"
description = "Brood War RL integration foundation with explicit benchmark provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
starforge = "starforge.__main__:main"

[tool.setuptools.packages.find]
include = ["starforge*"]
