name: Win32 bridge

on:
  push:
    branches: [native/wine-route1]
    paths:
      - native/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build matching SDK library, example, bridge, and loader probe
        shell: pwsh
        run: ./scripts/build-native.ps1
      - name: Retain verified binaries and relinking source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starforge-win32
          path: build/native/artifact/
          if-no-files-found: error
          retention-days: 7
